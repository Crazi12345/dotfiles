# ==============================================================================
# General & Performance Settings
# ==============================================================================
# Set terminal & truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:clipboard"
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:hyperlinks"

# Undercurl & underline color support for Neovim / modern terminals
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Eliminate escape delay (instant mode switching in Neovim/Vim)
set -sg escape-time 0

# History limit & message display
set -g history-limit 50000
set -g display-time 2000
set -g display-panes-time 2000

# Enable mouse support
set -g mouse on

# Focus events enabled for terminal / Neovim autoread & plugins
set -g focus-events on

# Allow terminal passthrough (images, kitty graphics protocol, OSC queries)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Don't detach tmux when closing last pane in session; switch to another session
set -g detach-on-destroy off

# Aggressive resize (resize based on active window client, not smallest overall)
setw -g aggressive-resize on

# Window titles (sync with terminal & Hyprland window rules)
set -g set-titles on
set -g set-titles-string "#S / #W - tmux"

# ==============================================================================
# Prefix & Keybindings
# ==============================================================================
# Set prefix to Ctrl-A
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Fast reload of configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux configuration reloaded!"

# Start window & pane indices at 1 for keyboard ergonomics
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Window and pane creation (preserving current directory)
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane switching (Vim style with Prefix, or Alt + key directly)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Pane resizing (Prefix + H / J / K / L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window
bind C-o rotate-window

# Maximize / Zoom toggle
bind m resize-pane -Z

# ==============================================================================
# Vi Mode & Clipboard (Wayland native + OSC 52)
# ==============================================================================
set-window-option -g mode-keys vi
set -s set-clipboard on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send-keys -X cancel

# ==============================================================================
# Popups & Fast Workflows
# ==============================================================================
# Fuzzy Sessionizer popup
bind-key -r f display-popup -E -w 75% -h 65% "~/.local/scripts/tmux-sessionizer"

# SSH Manager popup
bind-key -r F display-popup -E -w 75% -h 65% "~/.local/bin/ssh-manager"

# Project runners
bind-key -r S display-popup -E -w 80% -h 75% "dotnet run"
bind-key -r C display-popup -E -w 80% -h 75% "cargo run"

# Lazygit popup in current pane directory
bind-key -r G display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "lazygit"

# ==============================================================================
# High-Performance Status Bar & Appearance (Matte Nord Catppuccin Theme)
# ==============================================================================
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Colors (Nord / Catppuccin transparent palette for terminal lookthrough)
set -g status-style 'bg=default,fg=#d8dee9'

# Window pane transparency (allows terminal background opacity/lookthrough)
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# Status left: Session badge
set -g status-left-length 50
set -g status-left '#[fg=#12141a,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=default,nobold] '

# Status right: Zoom indicator, Path, Time
set -g status-right-length 80
set -g status-right '#[fg=#f9e2af,bg=default]#{?window_zoomed_flag,󰍉 ZOOMED  ,}#[fg=#616e88,bg=default]#{b:pane_current_path} #[fg=#414b5d]│ #[fg=#88c0d0,bg=default]%H:%M #[fg=#12141a,bg=#cba6f7,bold] #h '

# Window status format (inactive)
set -g window-status-format '#[fg=#616e88,bg=default] #I:#[fg=#d8dee9]#W '

# Window status format (active)
set -g window-status-current-format '#[fg=#12141a,bg=#89b4fa,bold] #I:#[fg=#12141a,bold]#W #[default]'

# Pane borders (subtle dark & transparent)
set -g pane-border-style 'fg=#2b3447,bg=default'
set -g pane-active-border-style 'fg=#414b5d,bg=default'

# Popup styling
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#414b5d,bg=default'

# Message & Mode styles
set -g message-style 'fg=#12141a,bg=#88c0d0,bold'
set -g mode-style 'fg=#12141a,bg=#89b4fa,bold'

# ==============================================================================
# Optional TPM Support (loads non-destructively if installed)
# ==============================================================================
if-shell '[ -f ~/.tmux/plugins/tpm/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
